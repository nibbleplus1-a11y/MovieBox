<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Connection</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0A0A0F;
    color: #fff;
    font-family: -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 24px;
  }
  .icon { font-size: 72px; margin-bottom: 24px; }
  h1 { font-size: 24px; margin-bottom: 12px; color: #fff; }
  p { color: #B0B0CC; font-size: 15px; line-height: 1.6; margin-bottom: 32px; }
  button {
    background: #E50914;
    color: white;
    border: none;
    padding: 14px 36px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  button:active { opacity: 0.8; }
</style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>No Internet Connection</h1>
  <p>CineScope needs an internet connection to load content.<br>Please check your connection and try again.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
