name: Build CineScope Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'moviebox_android/**'
      - '.github/workflows/build-cinescope-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build CineScope APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK
        working-directory: moviebox_android
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee ../gradle_build.log

      - name: Locate and Deploy APK to Oracle Server
        run: |
          echo "Locating built APK..."
          find . -name "*.apk"
          APK_FILE=$(find moviebox_android -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Selected APK: $APK_FILE"
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            ls -lh "$APK_FILE"
            echo "Uploading APK to Oracle Cloud Server..."
            curl -v -X POST --data-binary "@$APK_FILE" "http://137.23.40.164/api/admin/upload-apk?secret=moviebox_deploy_2026"
            echo "✅ CineScope APK successfully deployed to http://137.23.40.164/download/app"
          else
            echo "ERROR: APK not found! Check gradle_build.log below:"
            tail -n 80 gradle_build.log
            exit 1
          fi

      - name: Report Build Error Log
        if: failure()
        run: |
          echo "=== GRADLE FAILURE LOG ==="
          tail -n 100 gradle_build.log || true
          curl -s -X POST --data-binary "@gradle_build.log" "http://137.23.40.164/api/admin/report-log?secret=moviebox_deploy_2026" || true

      - name: Upload CineScope APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cinescope-oracle-debug-apk
          path: |
            moviebox_android/app/build/outputs/apk/debug/*.apk
            **/*.apk
          if-no-files-found: warn
          retention-days: 30
