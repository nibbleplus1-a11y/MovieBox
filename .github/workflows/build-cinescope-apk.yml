name: Build CineScope Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'moviebox_android/**'
      - '.github/workflows/build-cinescope-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build CineScope APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('moviebox_android/**/*.gradle*', 'moviebox_android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK with Gradle
        working-directory: moviebox_android
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find and Rename APK
        working-directory: moviebox_android
        run: |
          mkdir -p output
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" output/cinescope-debug.apk
            echo "Built APK size: $(ls -lh output/cinescope-debug.apk)"
          else
            echo "ERROR: APK not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinescope-oracle-debug-apk
          path: moviebox_android/output/cinescope-debug.apk
          retention-days: 30
