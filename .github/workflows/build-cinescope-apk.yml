name: Build CineScope Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'moviebox_android/**'
      - '.github/workflows/build-cinescope-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build CineScope APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK
        working-directory: moviebox_android
        run: |
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee ../gradle_build.log

      - name: Upload APK to Oracle Cloud Server
        if: success()
        run: |
          APK_FILE=$(find moviebox_android -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            echo "Uploading APK to Oracle Cloud ($APK_FILE)..."
            curl -sSf -X POST --data-binary "@$APK_FILE" "http://137.23.40.164/api/admin/upload-apk?secret=moviebox_deploy_2026"
            echo "✅ CineScope APK successfully deployed to http://137.23.40.164/download/app"
          fi

      - name: Report Build Error Log
        if: failure()
        run: |
          echo "=== GRADLE FAILURE LOG ==="
          tail -n 100 gradle_build.log || true
          curl -s -X POST --data-binary "@gradle_build.log" "http://137.23.40.164/api/admin/report-log?secret=moviebox_deploy_2026" || true

      - name: Upload CineScope APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cinescope-oracle-debug-apk
          path: moviebox_android/**/*.apk
          retention-days: 30
