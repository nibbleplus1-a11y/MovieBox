name: Build MovieVerse Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'cinescope/**'
      - '.github/workflows/build-cinescope-apk.yml'
      - 'api.py'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build MovieVerse Standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: cinescope/package-lock.json

      - name: Install dependencies
        working-directory: cinescope
        run: npm ci

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Make gradlew executable
        working-directory: cinescope/android
        run: chmod +x gradlew

      - name: Ensure debug.keystore exists
        run: |
          KEYSTORE="cinescope/android/app/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh "$KEYSTORE"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Standalone Release APK
        working-directory: cinescope/android
        run: |
          # Retry up to 3 times in case of transient CDN 504 errors on services.gradle.org
          SUCCESS=0
          for i in 1 2 3; do
            echo "Attempt $i: Building Standalone Release APK..."
            ./gradlew :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee ../../gradle_build.log
            if grep -q "BUILD SUCCESSFUL" ../../gradle_build.log; then
              echo "✅ BUILD SUCCESSFUL on attempt $i"
              SUCCESS=1
              break
            fi
            echo "⚠️ Attempt $i failed. Retrying in 10s..."
            sleep 10
          done
          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ BUILD FAILED after 3 attempts"
            echo "=== Last 100 lines of build log ==="
            tail -n 100 ../../gradle_build.log
            exit 1
          fi

      - name: Locate Built APK
        id: find_apk
        run: |
          APK_FILE=$(find cinescope/android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find cinescope/android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" 2>/dev/null | head -n 1)
          fi
          echo "Found APK: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            ls -lh "$APK_FILE"
          else
            echo "ERROR: APK not found after build!"
            exit 1
          fi

      - name: Deploy APK to Oracle Cloud Server
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
        run: |
          APK_FILE="${{ steps.find_apk.outputs.apk_path }}"
          SECRET="${DEPLOY_SECRET:-moviebox_deploy_2026}"
          BASE_URL="${SERVER_URL:-https://movieverse.click}"
          echo "Uploading: $APK_FILE ($(ls -lh $APK_FILE | awk '{print $5}'))"
          HTTP_STATUS=$(curl -s -o /tmp/upload_response.txt -w "%{http_code}" \
            -X POST \
            --data-binary "@$APK_FILE" \
            "${BASE_URL}/api/admin/upload-apk?secret=${SECRET}" \
            --max-time 180)
          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/upload_response.txt
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ MovieVerse standalone APK deployed to: ${BASE_URL}/download/app"
            curl -s -X POST \
              -H "Content-Type: application/json" \
              -d '{"version": "1.2.5", "version_code": 18, "download_url": "'"${BASE_URL}"'/download/app", "changelog": "Background downloads with notification tray progress, fixed auto-hiding floating bar, instant ad loading & offline video player!", "force_update": false}' \
              "${BASE_URL}/api/admin/set-version?secret=${SECRET}" || true
          else
            echo "⚠️ Upload returned HTTP $HTTP_STATUS — APK still available as GitHub artifact below."
          fi

      - name: Report Build Error Log
        if: failure()
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
        run: |
          SECRET="${DEPLOY_SECRET:-moviebox_deploy_2026}"
          BASE_URL="${SERVER_URL:-https://movieverse.click}"
          echo "=== GRADLE FAILURE LOG (last 150 lines) ==="
          tail -n 150 gradle_build.log || true
          curl -s -X POST --data-binary "@gradle_build.log" \
            "${BASE_URL}/api/admin/report-log?secret=${SECRET}" || true

      - name: Upload MovieVerse APK as GitHub Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movieverse-standalone-release-apk
          path: |
            cinescope/android/app/build/outputs/apk/release/*.apk
            cinescope/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30
