name: Build CineScope Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'moviebox_android/**'
      - '.github/workflows/build-cinescope-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build CineScope APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK
        working-directory: moviebox_android
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Locate Built APK
        working-directory: moviebox_android
        run: |
          ls -laR app/build/outputs/ || true
          find . -name "*.apk"

      - name: Upload CineScope APK
        uses: actions/upload-artifact@v4
        with:
          name: cinescope-oracle-debug-apk
          path: moviebox_android/**/*.apk
          retention-days: 30
