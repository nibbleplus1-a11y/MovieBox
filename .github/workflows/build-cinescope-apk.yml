name: Build CineScope Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'moviebox_android/**'
      - '.github/workflows/build-cinescope-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build CineScope APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK
        working-directory: moviebox_android
        run: |
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee ../gradle_build.log

      - name: Find and Stage APK
        working-directory: moviebox_android
        run: |
          mkdir -p output
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" output/cinescope-debug.apk
            echo "Built APK size: $(ls -lh output/cinescope-debug.apk)"
          else
            echo "ERROR: APK not found in app/build/outputs/apk/debug"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinescope-oracle-debug-apk
          path: moviebox_android/output/cinescope-debug.apk
          retention-days: 30

      - name: Upload Build Log if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log
