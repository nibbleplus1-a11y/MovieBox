name: Build MovieBox Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'android_app/**'
      - 'api.py'
      - 'static/**'
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  build-apk:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java 17 (Required by Android Gradle Plugin) ───────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Set up Python ─────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 4. Install system dependencies ───────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip \
            build-essential libssl-dev libffi-dev \
            libsqlite3-dev zlib1g-dev libbz2-dev \
            autoconf libtool pkg-config \
            cmake libltdl-dev

      # ── 5. Cache Buildozer global dir ────────────────────────────────────
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-webview-${{ hashFiles('android_app/buildozer.spec') }}
          restore-keys: buildozer-webview-

      # ── 6. Install Buildozer & Cython ────────────────────────────────────
      - name: Install Buildozer
        run: |
          pip install --upgrade pip wheel setuptools
          pip install buildozer cython

      # ── 7. Prepare build workspace ───────────────────────────────────────
      - name: Prepare build workspace
        run: |
          mkdir -p android_app/build_workspace/static
          cp android_app/main.py   android_app/build_workspace/
          cp android_app/buildozer.spec android_app/build_workspace/
          cp api.py                android_app/build_workspace/
          cp -r static/.           android_app/build_workspace/static/

      # ── 8. Build APK ─────────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android_app/build_workspace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: buildozer -v android debug

      # ── 8. Upload APK artifact ───────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moviebox-debug-apk
          path: android_app/build_workspace/bin/*.apk
          retention-days: 30

      # ── 9. Print APK size ────────────────────────────────────────────────
      - name: Print APK info
        run: |
          APK=$(find android_app/build_workspace/bin -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
